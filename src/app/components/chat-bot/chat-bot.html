<aside class="chatbot" aria-label="Recipe assistant">
  @if (open()) {
    <section class="chat-panel" role="dialog" aria-label="Recipe assistant chat">
      <header class="chat-header">
        <div>
          <span class="chat-avatar" aria-hidden="true">C</span>
          <div>
            <strong>Cook assistant</strong>
            <span class="chat-status"><span aria-hidden="true"></span> Ready to help</span>
          </div>
        </div>

        <div class="chat-actions">
          <button class="chat-clear" type="button" aria-label="Clear chat history" title="Clear chat" (click)="clearChat()">↺</button>
          <button class="chat-close" type="button" aria-label="Close chat" (click)="close()">×</button>
        </div>
      </header>

      <div class="chat-messages" aria-live="polite">
        @for (message of messages(); track message.id) {
          <div class="message" [class.user-message]="message.sender === 'user'">
            <span class="message-text">{{ message.text }}</span>
            <time>{{ message.time }}</time>
          </div>
        }
        @if (typing()) {
          <div class="message typing-indicator" aria-label="Cook assistant is typing">
            <span></span><span></span><span></span>
          </div>
        }
      </div>

      <div class="quick-replies" aria-label="Suggested questions">
        <button type="button" (click)="sendSuggested('Quick dinner ideas')">⚡ Quick dinner</button>
        <button type="button" (click)="sendSuggested('Vegetarian dinner')">🥬 Vegetarian</button>
        <button type="button" (click)="sendSuggested('Show top rated recipes')">★ Top rated</button>
      </div>

      <form class="chat-form" (submit)="send($event)">
        <label class="sr-only" for="chat-message">Message the cooking assistant</label>
        <input
          id="chat-message"
          type="text"
          maxlength="300"
          autocomplete="off"
          placeholder="Ask for a recipe idea…"
          [value]="draft()"
          (input)="updateDraft($event)"
          (keydown)="sendOnEnter($event)"
        />
        <button type="submit" [disabled]="!canSend()" aria-label="Send message">➤</button>
      </form>
    </section>
  }

  <button
    class="chat-launcher"
    type="button"
    [attr.aria-expanded]="open()"
    [attr.aria-label]="open() ? 'Close recipe assistant' : 'Open recipe assistant'"
    (click)="toggle()"
  >
    @if (open()) {
      <span aria-hidden="true">×</span>
    } @else {
      <span class="launcher-icon" aria-hidden="true">●</span>
      <span>Chat</span>
    }
  </button>
</aside>
